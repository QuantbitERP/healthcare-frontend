apiVersion: v1
kind: PersistentVolume
metadata:
  name: epis-api-billingui-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /var/nfs/general/billingui
    server: 192.168.5.249
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: epis-api-billingui-pvc
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
